name: Desktop packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: Ubuntu-22.04-x86_64
          - runner: ubuntu-24.04
            platform: Ubuntu-24.04-x86_64
          - runner: windows-2022
            platform: Windows-11-x64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build and smoke-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file xvfb xauth xdotool
      - name: Prepare offline PDF viewer
        run: python tools/prepare.py
      - name: Test stamp placement and PDF export
        run: cargo test --locked --release -p seal-core
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm exec --yes --package=@tauri-apps/cli@2.12.5 -- tauri build --bundles appimage -- --locked
      - name: Check AppImage startup and preserve execute permission
        if: runner.os == 'Linux'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          images=(target/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" = 1 && test -x "${images[0]}"
          mkdir -p "$RUNNER_TEMP/package" release
          image="$RUNNER_TEMP/package/Paperseal-$PLATFORM.AppImage"
          install -m 755 "${images[0]}" "$image"
          xvfb-run -a dbus-run-session -- bash -eu -c '
            export GDK_BACKEND=x11 WEBKIT_DISABLE_DMABUF_RENDERER=1 APPIMAGE_EXTRACT_AND_RUN=1
            "$1" & app=$!
            trap "kill $app 2>/dev/null || true" EXIT
            timeout 90 xdotool search --sync --onlyvisible --name "PDF" >/dev/null
          ' smoke "$image"
          tar -C "$RUNNER_TEMP/package" -czf "release/Paperseal-$PLATFORM.tar.gz" "$(basename "$image")"
      - name: Build Windows portable executable
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked -p pdf-seal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item -LiteralPath target/release/pdf-seal.exe -Destination release/Paperseal-Windows-11-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Paperseal-${{ matrix.platform }}
          path: release/
          if-no-files-found: error
